{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Выход</title>
    <link rel="stylesheet" href="{% static 'auth_module/css/style.css' %}">
</head>
<body>
    <div class="container">
        <!-- Блок для отображения сообщений -->
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li class="{{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        <h2>Logout</h2>
        <form method="post">
            {% csrf_token %}
            <p>Вы уверены, что хотите выйти?</p>
            <div class="button-group">
                <button type="submit" class="btn-danger">Выйти</button>
            
                {% comment %} <!-- <a href="{% url 'home' %}" class="btn-secondary">Отмена</a> --> {% endcomment %}
            </div>
        </form>
    </div>
    <script src="{% static 'auth_module/js/main.js' %}"></script>
</body>
</html>
